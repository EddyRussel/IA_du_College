services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    # GPU NVIDIA (facultatif) : ajouter deploy.resources.reservations.devices
  server:
    build: ./server
    environment:
      PORT: 4002
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      CORS_ORIGIN: http://localhost:5172
    ports: ["4002:4002"]
    depends_on: [ollama]
  client:
    build:
      context: ./client
      args: { VITE_API_URL: "http://localhost:4002" }
    ports: ["5172:80"]
volumes:
  ollama_data:
